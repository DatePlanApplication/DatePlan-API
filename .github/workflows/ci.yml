name: ci

on:
  pull_request:
  push:
    branches-ignore: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: config jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: make gradlew executable
        run: chmod +x gradlew

      # Os testes precisam de PostgreSQL, Redis e Firebase; por enquanto o CI só compila e empacota.
      - name: build
        run: ./gradlew build -x test --stacktrace
